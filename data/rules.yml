version: "3.1"


rules:

- rule: Greet user
  steps:
    - intent: greet
    - action: action_respond_greet

- rule: Math operations
  steps:
    - intent: math
    - action: action_handle_math

- rule: Handle name request
  steps:
  - intent: ask_name
  - action: respond_ask_name

- rule: Weather request
  steps:
  - intent: ask_weather
  - action: action_get_weather

- rule: Google search
  steps:
  - intent: search
  - action: action_google_search

- rule: Sentiment analysis
  steps:
  - intent: sentiment
  - action: action_sentiment_analysis

- rule: Analyze text
  steps:
  - intent: analyze_text
  - action: action_analyze_text

- rule: tell_joke
  steps:
    - intent: joke
    - action: action_tell_joke

- rule: Goodbye
  steps:
    - intent: goodbye
    - action: action_respond_goodbye

- rule: Show time
  steps:
    - intent: time
    - action: action_show_time

- rule: Show date
  steps:
    - intent: date
    - action: action_show_date