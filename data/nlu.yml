version: "3.1"

nlu:
- intent: greet
  examples: |
    - привет
    - здравствуй
    - добрый день
    - доброе утро
    - добрый вечер
    - приветик
    - привет
    - здравствуйте
    - добрый день

- intent: ask_name
  examples: |
    - как тебя зовут?
    - твое имя?
    - как к тебе обращаться?

- intent: ask_weather
  examples: |
    - какая погода?
    - расскажи про погоду
    - что по погоде?
    - погода
    - что по погоде в [Москве](location)?
    - температура воздуха
    - какая погода в [Москве](location)?
    - что по погоде в [Санкт-Петербурге](location)?
    - температура в [Нью-Йорке](location)

- intent: search
  examples: |
    - поиск [котики](query)
    - найди [новости](query)
    - поищи [рецепт пирога](query)
    - поиск 
    - найди
    - поиск [забор](query)
    - найди [аниме](query)
    - открой [википедия](query)
    - поищи [новости](query)
    - найди в гугле [рецепт пирога](query)

- intent: analyze_text
  examples: |
    - анализ [текста](text)
    - проанализируй [этот документ](text)
    - разбери [следующий текст](text)
    - анализ
    - разбери
    - разбери [кот бежал по тропинке](text)
    - проанализируй [я упал с велосипеда](text)
    - структура [этого предложения](text)

- intent: sentiment
  examples: |
    - тональность [этого сообщения](text)
    - оцени настроение [текста](text)
    - какой эмоциональный окрас?
    - тональность
    - оцени настроение [он урод](text)
    - какой эмоциональный окрас у [этого сообщения](text)?
    - проанализируй тональность [текста](text)

- intent: goodbye
  examples: |
    - пока
    - до свидания
    - увидимся
    - до встречи
    - прощай

- intent: joke
  examples: |
    - расскажи анекдот
    - пошути
    - рассмеши меня
    - анекдот

- intent: time
  examples: |
    - сколько времени?
    - который час?
    - текущее время
    - время

- intent: date
  examples: |
    - какая сегодня дата?
    - какое сегодня число?
    - какой день?

- intent: math
  examples: |
    - 2+2
    - 100*5
    - 45/9
    - 84 - 42
    - 432*15