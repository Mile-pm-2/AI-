version: "3.1"

nlu:
- intent: greet
  examples: |
    - привет
    - здравствуй
    - добрый день
    - доброе утро
    - добрый вечер
    - приветик

- intent: ask_name
  examples: |
    - как тебя зовут?
    - твое имя?
    - как к тебе обращаться?

- intent: ask_weather
  examples: |
    - какая погода?
    - расскажи про погоду
    - что по погоде?
    - погода

- intent: search
  examples: |
    - поиск [котики](query)
    - найди [новости](query)
    - поищи [рецепт пирога](query)

- intent: analyze_text
  examples: |
    - анализ [текста](text)
    - проанализируй [этот документ](text)
    - разбери [следующий текст](text)

- intent: sentiment
  examples: |
    - тональность [этого сообщения](text)
    - оцени настроение [текста](text)
    - какой эмоциональный окрас?

- intent: goodbye
  examples: |
    - пока
    - до свидания
    - увидимся
    - до встречи
    - прощай

- intent: joke
  examples: |
    - расскажи анекдот
    - пошути
    - рассмеши меня
    - анекдот

- intent: time
  examples: |
    - сколько времени?
    - который час?
    - текущее время
    - время

- intent: date
  examples: |
    - какая сегодня дата?
    - какое сегодня число?
    - какой день?

- intent: math
  examples: |
    - 2+2
    - 100*5
    - 45/9
    - 84 - 42
    - 432*15